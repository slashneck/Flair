  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="">
        <div class="brand-text">
          <div class="brand-name">Flair</div>
          <div class="live-status" id="live-status"><span class="live-dot"></span><span id="live-text">Starting</span></div>
        </div>
      </div>
      <button class="go-live" id="go-live" disabled>
        <span class="pulse"></span><span class="label" id="go-live-label">Go live</span><kbd id="go-live-kbd" hidden></kbd>
      </button>
      <nav class="nav">
        <div class="nav-section">Presets
          <span style="display:flex;gap:2px">
            <button class="icon-btn" id="import-btn" title="Import presets"><svg><use href="#i-import"/></svg></button>
            <button class="icon-btn" id="new-btn" title="New preset"><svg><use href="#i-plus"/></svg></button>
          </span>
        </div>
        <div id="preset-list"></div>
      </nav>
      <div class="sidebar-foot">
        <button class="nav-item" data-view="gallery"><svg><use href="#i-users"/></svg><span class="nav-label">Presets</span></button>
        <button class="nav-item" data-view="rotation"><svg><use href="#i-rotate"/></svg><span class="nav-label">Rotation</span><span class="badge" id="rotation-badge" hidden>On</span></button>
        <button class="nav-item" data-view="guide"><svg><use href="#i-book"/></svg><span class="nav-label">Guide</span></button>
        <button class="nav-item" data-view="settings"><svg><use href="#i-settings"/></svg><span class="nav-label">Settings</span></button>
      </div>
